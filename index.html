<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小屋日常 · Tiny Home</title>
  <meta name="description" content="一个住在 3D 大平层里的小人和一只橘猫，按自己的需求过日子：做饭、洗澡、上班、撸猫、晾衣服、睡觉。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>" />
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="bubble" class="bubble"><span></span></div>
  <div id="cat-bubble" class="bubble small"><span></span></div>

  <aside id="hud">
    <section class="card" id="clock-card">
      <div class="clock-top"><span id="day">第 1 天</span><span id="period"></span><button id="hud-toggle" title="展开/收起">▾</button></div>
      <div id="time">--:--</div>
      <div id="mode-badge"></div>
    </section>

    <section class="card" id="status-card">
      <div class="who">🧒 小豆</div>
      <div id="doing">…</div>
      <div id="needs"></div>
      <div class="cat-line"><b>🐱 橘子</b><span id="cat-doing">…</span></div>
    </section>

    <section class="card" id="controls">
      <div class="row">
        <button data-mode="real">🕐 真实时间</button>
        <button data-mode="fast">⏩ 加速</button>
      </div>
      <div class="row" id="speed-row">
        <button data-speed="0" title="暂停（空格）">⏸</button>
        <button data-speed="1">×60</button>
        <button data-speed="2">×120</button>
        <button data-speed="8">×480</button>
        <button data-speed="24">×1440</button>
      </div>
      <div id="speed-hint"></div>
      <div class="row">
        <button id="btn-follow">📍 跟小豆</button>
        <button id="btn-follow-cat">📍 跟橘子</button>
      </div>
    </section>
  </aside>

  <section class="card" id="log">
    <h2>📓 小豆的日记</h2>
    <ul id="log-list"></ul>
  </section>

  <div id="hint">拖动旋转 · 右键 / 双指平移 · 滚轮缩放</div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
